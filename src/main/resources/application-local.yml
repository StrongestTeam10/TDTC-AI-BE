spring:
  datasource:
    url: ${DEV_DB_URL:jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require}
    username: ${DEV_DB_USERNAME}
    password: ${DEV_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate   # 스키마는 schema-init.sql로 관리, 엔티티가 스키마를 덮어쓰지 않도록 validate 고정
        # (2026-07-23: AcousticEvent/RadarReading 등 테이블 없는 엔티티를 전부
      #  삭제해서 validate로 복원함. none으로 뒀던 임시 조치는 더 이상 불필요)
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# FastAPI 시뮬레이션 엔진 (로컬 실행 시 별도 프로세스로 uvicorn 구동 필요)
simulation-engine:
  base-url: http://localhost:8000

cors:
  allowed-origins:
    - http://localhost:5173

# 2026-07-24 추가: 로그인 시 발급하는 JWT 서명 키. HS256은 최소 32바이트(256비트)
# 이상 필요. 로컬 개발용 기본값을 넣어뒀지만, 이 값 그대로 배포하면 안 됨
# (application-prod.yml은 환경변수 JWT_SECRET을 필수로 받도록 되어 있음).
jwt:
  secret: ${JWT_SECRET:tdtc-ai-local-dev-only-secret-key-please-change-1234567890}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}   # 기본 1시간

# 2026-07-24 추가: 게시판 첨부파일 저장용 S3. 자격증명은 여기 넣지 않고
# AWS 기본 자격증명 체인(환경변수 AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY 또는
# ~/.aws/credentials)을 그대로 사용함(S3Config 참고).
# 로컬에서 board 기능을 테스트하려면:
#   1) S3 버킷을 하나 만들고
#   2) 아래 AWS_S3_BUCKET 환경변수(또는 기본값)를 그 버킷명으로 맞추고
#   3) 로컬 환경에 AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY를 설정할 것
aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${AWS_S3_BUCKET:tdtc-ai-board-attachments-dev}
    # 2026-07-31 추가: 보고서는 게시판 첨부파일과 다른 버킷에 저장한다.
    # 사용자 업로드물과 시스템 생성물은 보존 정책이 달라 분리했다.
    report-bucket: ${AWS_S3_REPORT_BUCKET:tdtc-ai-report}