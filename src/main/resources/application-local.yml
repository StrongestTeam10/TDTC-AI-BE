    url: ${DEV_DB_URL:jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require}
    username: ${DEV_DB_USERNAME:postgres.uusnthiedfwzlcsgtnhn}
    password: ${DEV_DB_PASSWORD:tdtcStrong10!}
  jpa:
    hibernate:
      ddl-auto: none   # AcousticEvent/AcousticEventLog 엔티티에 대응하는 테이블(audevnt01m/h)을 DB에서 제거했으나
                       # 엔티티 코드는 유지하기로 결정 → validate 사용 시 테이블 불일치로 부팅 실패하므로 none으로 변경.
                       # (스키마는 여전히 schema-init.sql로 관리하며, 이 설정으로 인해 엔티티가 스키마를 덮어쓰지는 않음.
                       #  단, validate가 제공하던 "엔티티-스키마 불일치 조기 탐지" 기능은 19개 테이블 전체에서 사라짐.)
    show-sql: true
    properties:
      hibernate:
        format_sql: true

