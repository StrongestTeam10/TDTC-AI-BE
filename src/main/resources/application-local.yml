spring:
  datasource:
    url: ${DEV_DB_URL:jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require}
    username: ${DEV_DB_USERNAME}
    password: ${DEV_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate   # 스키마는 schema-init.sql로 관리, 엔티티가 스키마를 덮어쓰지 않도록 validate 고정
                           # (2026-07-23: AcousticEvent/RadarReading 등 테이블 없는 엔티티를 전부
                           #  삭제해서 validate로 복원함. none으로 뒀던 임시 조치는 더 이상 불필요)
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# FastAPI 시뮬레이션 엔진 (로컬 실행 시 별도 프로세스로 uvicorn 구동 필요)
simulation-engine:
  base-url: http://localhost:8000

cors:
  allowed-origins:
    - http://localhost:5173
