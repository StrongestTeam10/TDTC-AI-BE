spring:
  datasource:
    url: ${DEV_DB_URL}
    username: ${DEV_DB_USERNAME}
    password: ${DEV_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate   # 스키마는 schema-init.sql로 관리, 엔티티가 스키마를 덮어쓰지 않도록 validate 고정
        # ( AcousticEvent/RadarReading 등 테이블 없는 엔티티를 전부
      #  삭제해서 validate로 복원함. none으로 뒀던 임시 조치는 더 이상 불필요)
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# FastAPI 시뮬레이션 엔진 (로컬 실행 시 별도 프로세스로 uvicorn 구동 필요)
simulation-engine:
  base-url: http://localhost:8000

# prod와 동일한 이유로 리스트 -> 스칼라.
# 로컬은 값이 기본값과 우연히 같아서 문제가 드러나지 않았을 뿐, 원래 안 읽히고 있었다.
#
# 포트를 5173으로 고정해뒀더니, Vite dev 서버를 두 개 띄우거나
# 5173이 다른 프로세스에 잡혀 있을 때 Vite가 5174, 5175로 올려 잡으면서 API가
# 전부 CORS에 막혔다(화면은 뜨는데 로그인부터 실패). 포트를 열어둔다.
# :[*] 는 포트 전체를 뜻하는 Spring의 오리진 패턴 문법이고, SecurityConfig가
# '*'가 든 항목만 setAllowedOriginPatterns로 넘긴다.
# ⚠️ 쉼표는 오리진 구분자라 :[5173,5174] 같은 포트 목록은 쓸 수 없다.
#
# 로컬 전용이다 - 운영(application-prod.yml)은 정확 일치를 그대로 쓴다.
cors:
  allowed-origins: http://localhost:[*]

# 로그인 시 발급하는 JWT 서명 키. HS256은 최소 32바이트(256비트)
# 이상 필요. 로컬 개발용 기본값을 넣어뒀지만, 이 값 그대로 배포하면 안 됨
# (application-prod.yml은 환경변수 JWT_SECRET을 필수로 받도록 되어 있음).
jwt:
  secret: ${JWT_SECRET:tdtc-ai-local-dev-only-secret-key-please-change-1234567890}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}   # 기본 1시간

# 재변경: 게시판 첨부파일 저장용 S3. 자격증명은
# 여기 넣지 않고 AWS 기본 자격증명 체인(환경변수 AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY
# 또는 ~/.aws/credentials)을 그대로 사용함(S3Config 참고).
# 게시판 첨부파일과 보고서를 버킷 하나(tdtc-ai-report)로 통합하기로 함
# (기존엔 "사용자 업로드물 vs 시스템 생성물, 보존정책이 다르다"는 이유로 버킷을
# 분리했었는데, 재재님 결정으로 다시 합침). 같은 버킷 안에서 board/, reports/로
# 폴더(키 접두사)만 나눠서 충돌 없이 구분함(PostService.ATTACHMENT_KEY_PREFIX,
# ReportService.KEY_PREFIX 참고).
aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${AWS_S3_BUCKET:tdtc-ai-report}
    report-bucket: ${AWS_S3_REPORT_BUCKET:tdtc-ai-report}