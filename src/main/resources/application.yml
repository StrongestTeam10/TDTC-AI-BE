spring:
  application:
    name: market-digital-twin-backend
  profiles:
    active: local
  # 2026-07-24 추가(게시판 첨부파일): Spring 기본값(1MB)은 문서/이미지 첨부에 너무 작아서 상향.
  # 요건대로 정한 값은 아니라서 프로젝트 정책에 맞게 조정 가능 (당장은 개당 20MB/요청당 50MB로 설정)
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

naver:
  client:
    id: ${NAVER_CLIENT_ID:your_client_id}
    secret: ${NAVER_CLIENT_SECRET:your_client_secret}

aws:
  video:
    bucket: tdtc-ai-cctv

emergency:
  target-phone: "119"

ai:
  secret-key: "tdtc-super-secret-key-2026"
