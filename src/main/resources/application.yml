spring:
  application:
    name: market-digital-twin-backend
  profiles:
    active: local
  # 2026-07-24 추가(게시판 첨부파일): Spring 기본값(1MB)은 문서/이미지 첨부에 너무 작아서 상향.
  # 요건대로 정한 값은 아니라서 프로젝트 정책에 맞게 조정 가능 (당장은 개당 20MB/요청당 50MB로 설정)
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # 2026-08-13 추가: DB 스키마 마이그레이션(Flyway)
  #
  # 지금까지는 schema-init.sql을 SQL Editor에서 손으로 태우는 방식이었다. 그러면
  # (1) 어느 DB에 어디까지 적용됐는지 기록이 남지 않고 (2) 운영에 DDL을 먼저 치고
  # 코드를 배포하는 순서를 사람이 매번 지켜야 했다. ddl-auto가 validate라서 순서가
  # 어긋나면 애플리케이션이 기동 자체에 실패한다.
  # 이제 기동 시 Flyway가 스키마를 맞춘 뒤 Hibernate가 검증하므로 순서가 보장된다.
  flyway:
    enabled: true
    locations: classpath:db/migration

    # ⚠️ 이 프로젝트는 테이블이 이미 들어 있는 DB(운영 RDS·개발 DB)에 Flyway를
    #    나중에 붙인 경우다. 그대로 두면 첫 기동에서 V1(전체 스키마 생성)을 실행하려다
    #    "이미 존재한다"로 실패한다.
    #
    #    baseline-on-migrate=true : 관리 이력(flyway_schema_history)이 없는데 스키마에
    #      객체가 이미 있으면, 그 DB를 baseline-version에 도달한 것으로 표시만 하고
    #      그보다 낮거나 같은 버전은 실행하지 않는다.
    #    baseline-version=1       : V1(기준 스키마)을 적용 완료로 간주한다.
    #
    #    결과적으로
    #      기존 DB → V1 건너뛰고 V2부터 적용
    #      빈  DB → V1부터 전부 실행
    #    두 경우 모두 같은 최종 스키마에 도달한다.
    baseline-on-migrate: true
    baseline-version: 1

    # 적용이 끝난 마이그레이션 파일이 수정되면 기동을 거부한다(기본값). 이미 반영된
    # 변경을 나중에 고쳐도 DB에는 반영되지 않아 코드와 실제 스키마가 갈리기 때문이다.
    validate-on-migrate: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

naver:
  client:
    id: ${NAVER_CLIENT_ID:your_client_id}
    secret: ${NAVER_CLIENT_SECRET:your_client_secret}

aws:
  video:
    bucket: tdtc-cctv-upload

# 2026-08-14 추가: 브이월드(공간정보 오픈플랫폼) 건물 폴리곤 적재.
#
# api-key에 콜론 기본값(빈 문자열)을 두는 이유는 naver.client.*/solapi.*와 같다 -
# 키가 없으면 "건물 자동 적재"라는 그 기능만 못 쓰고, 앱 기동이나 다른 기능은
# 멀쩡해야 한다. 키가 비어 있으면 BuildingImportService가 400으로 안내한다.
#
# domain: 브이월드는 인증키 발급 시 등록한 URL을 요청에 함께 보내도록 요구한다
# (서버 사이드 호출은 Referer가 없어서 이 파라미터로 대신한다). 발급 화면에 적은
# 주소와 정확히 같아야 하며, 다르면 키가 맞아도 거부된다.
# 2026-08-14 추가: OpenStreetMap(Overpass API)에서 시장 경계 폴리곤을 찾아온다.
# 인증키가 없다. 다만 공개 서버라 호출량 제한이 있어서, 실패하면 사용자에게 알리고
# 직접 그리는 길로 돌아가게 한다(OsmMarketBoundaryClient 참고).
osm:
  # 쉼표로 구분한 미러 목록. 앞에서부터 시도하고 실패하면 다음으로 넘어간다.
  #
  # 공개 Overpass 서버는 IP당 동시 요청과 일일 할당이 빡빡해서 504·429가 자주 난다
  # (2026-08-14 확인: 본진 overpass-api.de가 504, kumi.systems는 정상). 미러를
  # 하나만 두면 그 서버가 흔들릴 때 기능 전체가 멈춘다.
  overpass-urls: ${OSM_OVERPASS_URLS:https://overpass.kumi.systems/api/interpreter,https://overpass-api.de/api/interpreter}
  # 같은 좌표를 다시 물어보면 이 시간 동안은 서버에 안 묻는다. 시장 경계는 거의
  # 바뀌지 않고, 등록 화면에서 같은 시장을 여러 번 시도하는 일이 잦다.
  cache-minutes: ${OSM_CACHE_MINUTES:60}

vworld:
  base-url: https://api.vworld.kr
  api-key: ${VWORLD_API_KEY:}
  domain: ${VWORLD_DOMAIN:http://localhost:8080}
  # 건물 레이어. 폴리곤 + 지상층수(gro_flo_co) + 건물관리번호(bd_mgt_sn)를 준다.
  building-layer: ${VWORLD_BUILDING_LAYER:LT_C_SPBD}

# 2026-08-12: 아래 5개는 필수값(기본값 없음)이었다가 로컬/EC2/CI 전부를 기동
# 불가로 만들어서 되돌림. SMS는 JWT_SECRET/DB 비밀번호 같은 보안 필수값이 아니라
# "설정 안 하면 그 기능만 안 되는" 선택 기능이라, naver.client.* 와 같은 방식으로
# 콜론 기본값을 둔다. solapi.*가 비어 있으면 NurigoApp.initialize가 인증 실패로
# 끝나고, sendEmergencySms()는 그 예외를 잡아 로그만 남긴다(ExternalNotificationService
# 참고) - 앱 기동 자체는 막지 않는다.
emergency:
  target-phone: ${EMERGENCY_TARGET_PHONE:}
  
ai:
  secret-key: ${AI_SECRET_KEY:}
solapi:
  api-key: ${SOLAPI_API_KEY:}
  api-secret: ${SOLAPI_API_SECRET:}
  sender-phone: ${SOLAPI_SENDER_PHONE:}
