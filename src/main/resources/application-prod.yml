spring:
  datasource:
    url: ${PRO_DB_URL}          # 예: jdbc:postgresql://<RDS 엔드포인트 또는 Supabase>:5432/postgres
    username: ${PRO_DB_USERNAME}
    password: ${PRO_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate   # 엔티티와 실제 스키마가 어긋나면 기동을 막는다.
    show-sql: false

# FastAPI 시뮬레이션 엔진 - 같은 VPC 내부 주소 사용 권장 (외부 미노출)
simulation-engine:
  base-url: ${PRO_SIMULATION_ENGINE_URL}

# 리스트가 아니라 스칼라여야 한다.
# SecurityConfig의 @Value("${cors.allowed-origins:...}")는 YAML 리스트를 읽지 못한다.
# 리스트는 cors.allowed-origins[0] 형태의 키로 펼쳐져서 ${cors.allowed-origins}가
# 해석되지 않고, 조용히 기본값(http://localhost:5173)으로 떨어진다.
# 그 결과 운영에서 S3 오리진의 요청이 전부 403으로 막혔다(실측 확인).
#
# 여러 오리진이 필요하면 쉼표로 구분한다(@Value의 String[] 바인딩이 쉼표로 나눈다).
#   예: cors.allowed-origins: https://a.example.com,https://b.example.com
cors:
  allowed-origins: ${PRO_FRONTEND_ORIGIN}    # 예: https://d1234abc.cloudfront.net

# 운영 환경에서는 JWT_SECRET을 반드시 환경변수로 설정해야 함
# (기본값 없음 - 안 정하면 기동 실패). 32바이트(256비트) 이상의 무작위 문자열 권장.
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

# 재변경: 게시판 첨부파일 저장용 S3 (운영). 자격증명은
# 환경변수/EC2·ECS 인스턴스 role의 기본 자격증명 체인을 사용하고 여기 직접 넣지
# 않음(S3Config 참고). 게시판 첨부파일과 보고서를 버킷 하나로 통합했으므로
# AWS_S3_BUCKET과 AWS_S3_REPORT_BUCKET을 같은 버킷명(tdtc-ai-report)으로 설정할 것.
# AWS_S3_BUCKET은 운영 배포 전 반드시 실제 버킷명으로 설정해야 함(기본값 없음).
aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${AWS_S3_BUCKET}
    report-bucket: ${AWS_S3_REPORT_BUCKET:${AWS_S3_BUCKET}}

# (보안 감사 BE-08): 운영에서 API 문서를 닫는다.
#
# application.yml의 springdoc 설정은 프로파일 공통이라 운영에서도 그대로 살아
# 있었고, SecurityConfig가 /swagger-ui/**, /v3/api-docs/** 를 permitAll로 두기
# 때문에 누구나 인증 없이 전체 API 명세를 받아갈 수 있었다. 엔드포인트 경로와
# 요청/응답 필드가 전부 들어 있어서 공격자에게는 공격 표면 지도가 된다.
#
# api-docs를 끄면 스펙(JSON) 생성 자체가 없어지고, swagger-ui는 그 스펙을 읽어
# 그리는 화면이라 함께 막힌다. 둘 다 명시하는 이유는 UI만 끄고 /v3/api-docs를
# 열어두는 실수를 방지하기 위함이다(스펙만 있어도 노출 문제는 그대로다).
#
# ⚠️ 로컬·개발(application-local.yml)에는 넣지 않는다. Swagger는 개발 중
#    API 확인에 계속 쓰이고, 막아야 하는 대상은 외부에 열린 운영뿐이다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
