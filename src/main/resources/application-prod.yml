spring:
  datasource:
    url: ${PRO_DB_URL}          # 예: jdbc:postgresql://<RDS 엔드포인트 또는 Supabase>:5432/postgres
    username: ${PRO_DB_USERNAME}
    password: ${PRO_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate   # 2026-07-23: AcousticEvent/RadarReading 등 테이블 없는 엔티티를 전부 삭제해서
                           # validate로 복원함 (none으로 뒀던 임시 조치는 더 이상 불필요)
    show-sql: false

# FastAPI 시뮬레이션 엔진 - 같은 VPC 내부 주소 사용 권장 (외부 미노출)
simulation-engine:
  base-url: ${PRO_SIMULATION_ENGINE_URL}

cors:
  allowed-origins:
    - ${PRO_FRONTEND_ORIGIN}    # 예: https://d1234abc.cloudfront.net (추후 실제 도메인으로 교체)
