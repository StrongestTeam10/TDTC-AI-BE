spring:
  datasource:
    url: ${DB_URL}          # 예: jdbc:postgresql://<RDS 엔드포인트>:5432/market_twin
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

# FastAPI 시뮬레이션 엔진 - 같은 VPC 내부 주소 사용 권장 (외부 미노출)
simulation-engine:
  base-url: ${SIMULATION_ENGINE_URL}

cors:
  allowed-origins:
    - ${FRONTEND_ORIGIN}    # 예: https://d1234abc.cloudfront.net (추후 실제 도메인으로 교체)
