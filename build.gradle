plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.markettwin'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Web (REST API)
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // WebFlux는 전체 도입 대신 WebClient만 사용 (FastAPI 시뮬레이션 엔진 호출용)
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // JPA + PostgreSQL
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'

    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // 2026-07-24 추가: 로그인/회원가입(인증) - Spring Security(비밀번호 해시, 인증 필터)
    // + JWT(jjwt) - 로그인 성공 시 발급하는 액세스 토큰
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // 2026-07-24 추가: 게시판 첨부파일 업로드/다운로드(S3) - S3Client(업로드/삭제),
    // S3Presigner(다운로드용 임시 서명 URL 발급)에 사용
    implementation platform('software.amazon.awssdk:bom:2.28.16')
    implementation 'software.amazon.awssdk:s3'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // API 문서화 (Swagger UI)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // Actuator (헬스체크, 배포 모니터링용)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
