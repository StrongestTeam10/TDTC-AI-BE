plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.markettwin'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// 2026-08-14: Flyway 버전을 Spring Boot가 관리하는 값(10.10.0)보다 올린다.
//
// 10.10.0은 PostgreSQL 16까지만 검증된 버전이라, PostgreSQL 17인 개발/운영 DB에
// 붙을 때마다 기동 로그에 경고가 남았다.
//   WARN o.f.c.internal.database.base.Database :
//     Flyway upgrade recommended: PostgreSQL 17.6 is newer than this version of
//     Flyway and support has not been tested.
//
// PostgreSQL 17 지원은 Flyway 10.20.0(2024-10-16)에 들어갔다. 10.x 안에서만 올려
// 메이저 변경(11.x)의 동작 차이를 피한다. spring-boot BOM이 노출하는 flyway.version
// 속성을 덮어쓰는 방식이라 flyway-core / flyway-database-postgresql이 함께 올라간다.
ext['flyway.version'] = '10.22.0'

repositories {
    mavenCentral()
}

dependencies {
    // Web (REST API)
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // WebFlux는 전체 도입 대신 WebClient만 사용 (FastAPI 시뮬레이션 엔진 호출용)
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // JPA + PostgreSQL
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'

    // 2026-08-13: DB 스키마 마이그레이션. 기동 시 db/migration의 V*.sql을 순서대로
    // 적용하고 flyway_schema_history에 기록한다. ddl-auto는 validate 그대로 두므로,
    // Flyway가 스키마를 맞춘 뒤 Hibernate가 엔티티와 대조하는 순서가 된다
    // (Spring Boot가 Flyway를 EntityManagerFactory보다 먼저 실행한다).
    //
    // flyway-database-postgresql이 따로 필요한 이유: Flyway 10부터 DB별 지원이
    // 모듈로 분리되어, core만 넣으면 "No database found to handle jdbc:postgresql"로 실패한다.
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // 2026-07-24 추가: 로그인/회원가입(인증) - Spring Security(비밀번호 해시, 인증 필터)
    // + JWT(jjwt) - 로그인 성공 시 발급하는 액세스 토큰
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // 2026-07-24 추가: 게시판 첨부파일 업로드/다운로드(S3) - S3Client(업로드/삭제),
    // S3Presigner(다운로드용 임시 서명 URL 발급)에 사용
    implementation platform('software.amazon.awssdk:bom:2.28.16')
    implementation 'software.amazon.awssdk:s3'

    // 2026-08-04 추가: 상점 외관 사진(직접 촬영) EXIF GPS/촬영일시 추출 - 서버 사이드 처리
    implementation 'com.drewnoakes:metadata-extractor:2.19.0'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // API 문서화 (Swagger UI)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // Actuator (헬스체크, 배포 모니터링용)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Gradle 9부터는 JUnit Platform launcher를 테스트 런타임에 명시해야 한다.
    // 없으면 컴파일은 되지만 "Failed to load JUnit Platform"으로 실행이 막힌다.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    //CCTV 관제 대시보드 자동신고 SMS 발송(Solapi V4)
    implementation 'net.nurigo:sdk:4.3.0'

    // PDF 생성 라이브러리 (OpenPDF) 08-16 추가
    implementation 'com.github.librepdf:openpdf:1.3.30'

}

tasks.named('test') {
    useJUnitPlatform()
}
