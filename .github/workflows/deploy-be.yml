# =============================================================================
# 이 파일을 TDTC-AI-BE 저장소의 .github/workflows/deploy-be.yml 로 복사해서 사용합니다.
# 사전 준비(Environment, Secrets 4개)는 docs/CICD_SETUP.md 참고.
#
# 흐름: main push -> 이미지 빌드 & ECR push -> [수동 승인] -> EC2 배포
# =============================================================================
name: Deploy BE

on:
  push:
    branches: [main]
  workflow_dispatch: # 수동 재배포용

env:
  AWS_REGION: ap-northeast-2

# 배포가 겹치면 컨테이너 상태가 꼬이므로 한 번에 하나만 실행합니다.
# 진행 중인 배포는 취소하지 않습니다(중간에 끊기면 더 위험).
concurrency:
  group: deploy-be
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1) 빌드 + ECR push
  #    주의: 이 job에는 environment를 붙이지 않습니다.
  #    environment를 붙이면 OIDC sub 클레임이 environment 형식으로 바뀌어
  #    IAM Role 신뢰 정책(ref:refs/heads/main)과 맞지 않아 assume이 실패합니다.
  # ---------------------------------------------------------------------------
  build:
    name: Build & push image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # OIDC 토큰 발급에 필요

    # job 출력으로 이미지 주소를 넘기지 않습니다.
    # ECR_REPOSITORY_URL이 Secret이라, 그 값으로 만든 출력은 GitHub이
    # "Skip output 'image' since it may contain secret" 으로 폐기합니다.
    # deploy job은 같은 커밋에서 돌므로 태그를 스스로 계산합니다.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image tag
        id: meta
        run: |
          echo "image=${{ secrets.ECR_REPOSITORY_URL }}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ secrets.ECR_REPOSITORY_URL }}:latest
          # GitHub Actions 캐시에 레이어를 보관해 Gradle 의존성 재다운로드를 피합니다.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # 2) EC2 배포 (수동 승인 게이트)
  #    environment: production 에 Required reviewers를 걸어두면
  #    이 job이 시작되기 전에 승인 대기 상태가 됩니다.
  #
  #    2026-08-09: SSH에서 SSM으로 전환했습니다.
  #    보안그룹이 22번 포트를 관리자 IP 하나에만 열어두는데 GitHub Actions 러너는
  #    다른 IP에서 뜨므로 SSH 접속이 불가능했습니다. SSM은 인스턴스가 아웃바운드로
  #    연결하는 방식이라 인바운드 포트가 필요 없고, 배포용 SSH 키도 필요 없습니다.
  #
  #    주의: 이 job에는 environment가 붙어 있어 OIDC sub 클레임이
  #    ":environment:production" 형식이 됩니다. IAM 신뢰 정책에 그 형식도
  #    허용되어 있어야 자격증명을 받을 수 있습니다.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write # SSM 호출에 필요한 AWS 자격증명을 OIDC로 받습니다

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM
        env:
          # needs.build.outputs.image 를 쓰지 않습니다.
          # ECR_REPOSITORY_URL이 Secret이라 그 값이 섞인 job 출력은 GitHub이 버리고,
          # deploy job에서 빈 문자열이 되어 docker login이 Docker Hub로 붙어 실패했습니다.
          #   (Get "https://registry-1.docker.io/v2/": malformed HTTP Authorization header)
          # 태그는 커밋 SHA 앞 7자로 결정되고 두 job이 같은 커밋에서 돌기 때문에,
          # 여기서 다시 조립하면 build가 push한 것과 정확히 같은 주소가 됩니다.
          ECR_REPO: ${{ secrets.ECR_REPOSITORY_URL }}
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          IMAGE="${ECR_REPO}:${GITHUB_SHA::7}"
          if [ -z "${ECR_REPO}" ]; then
            echo "::error::ECR_REPOSITORY_URL Secret이 비어 있습니다."
            exit 1
          fi

          # EC2에서 실행할 스크립트. ECR 인증은 인스턴스 프로파일로 처리되므로
          # 자격증명을 넘길 필요가 없습니다.
          SCRIPT=$(cat <<EOF
          set -e
          cd /opt/tdtc-ai
          export BE_IMAGE='${IMAGE}'
          REGISTRY="\${BE_IMAGE%%/*}"
          aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin "\$REGISTRY"
          docker compose pull be
          docker compose up -d be
          docker image prune -f

          # ---- 컨테이너 헬스체크 ----
          # 아래 .env 갱신을 "정상 기동 확인 후"에만 하기 위한 게이트.
          # 바깥의 Health check 스텝은 nginx를 거친 최종 확인이고, 여기서는
          # .env를 새 태그로 넘겨도 되는지만 판단한다. (deploy-sim.yml과 같은 방침)
          echo "--- BE 컨테이너 헬스체크 ---"
          HEALTHY=0
          for i in \$(seq 1 30); do
            sleep 5
            if docker compose exec -T be curl -fsS http://localhost:8080/actuator/health 2>/dev/null | grep -q '"status":"UP"'; then
              echo "[\$i] UP"
              HEALTHY=1
              break
            fi
            echo "[\$i] 기동 대기..."
          done
          if [ "\$HEALTHY" -ne 1 ]; then
            echo "BE 헬스체크 실패 - .env는 마지막 정상 이미지를 유지한다"
            docker compose logs --tail 50 be || true
            exit 1
          fi

          # .env 를 새 태그로 갱신한다. export만 하면 이 SSM 세션에서만 유효해서,
          # 나중에 EC2 재부팅이나 수동 docker compose up -d 때 .env 에 남아 있던
          # 옛 이미지로 되돌아간다. (2026-08-20 실제 발생: 수동 재기동이 낡은
          # latest 태그로 롤백되면서 시장 등록 API들이 500을 반환했다)
          if grep -q '^BE_IMAGE=' .env; then
            sed -i "s|^BE_IMAGE=.*|BE_IMAGE=\${BE_IMAGE}|" .env
          else
            echo "BE_IMAGE=\${BE_IMAGE}" >> .env
          fi
          echo ".env BE_IMAGE 갱신 완료: \${BE_IMAGE}"
          EOF
          )

          # jq로 JSON을 만들어 따옴표 이스케이프 문제를 피합니다.
          PARAMS=$(jq -n --arg s "$SCRIPT" '{commands: ($s | split("\n"))}')

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy be ${GITHUB_SHA::7}" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" --output text)
          echo "SSM CommandId: $CMD_ID"

          for i in $(seq 1 60); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "  [$i] $STATUS"
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                echo "::error::배포 실패 ($STATUS)"
                aws ssm get-command-invocation --command-id "$CMD_ID" \
                  --instance-id "$INSTANCE_ID" --query "StandardErrorContent" --output text
                exit 1 ;;
            esac
          done

          echo "--- 실행 결과 ---"
          aws ssm get-command-invocation --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text

      - name: Health check
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "컨테이너 기동 대기..."
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 "http://${EC2_HOST}/actuator/health" | grep -q '"status":"UP"'; then
              echo "배포 성공: 헬스체크 통과"
              exit 0
            fi
            sleep 5
          done
          echo "헬스체크 실패 - 30회(약 150초) 시도 후 포기"
          exit 1
