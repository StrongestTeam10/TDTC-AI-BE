# =============================================================================
# 이 파일을 TDTC-AI-BE 저장소의 .github/workflows/deploy-be.yml 로 복사해서 사용합니다.
# 사전 준비(Environment, Secrets 4개)는 docs/CICD_SETUP.md 참고.
#
# 흐름: main push -> 이미지 빌드 & ECR push -> [수동 승인] -> EC2 배포
# =============================================================================
name: Deploy BE

on:
  push:
    branches: [main]
  workflow_dispatch: # 수동 재배포용

env:
  AWS_REGION: ap-northeast-2

# 배포가 겹치면 컨테이너 상태가 꼬이므로 한 번에 하나만 실행합니다.
# 진행 중인 배포는 취소하지 않습니다(중간에 끊기면 더 위험).
concurrency:
  group: deploy-be
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1) 빌드 + ECR push
  #    주의: 이 job에는 environment를 붙이지 않습니다.
  #    environment를 붙이면 OIDC sub 클레임이 environment 형식으로 바뀌어
  #    IAM Role 신뢰 정책(ref:refs/heads/main)과 맞지 않아 assume이 실패합니다.
  # ---------------------------------------------------------------------------
  build:
    name: Build & push image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # OIDC 토큰 발급에 필요

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image tag
        id: meta
        run: |
          echo "image=${{ secrets.ECR_REPOSITORY_URL }}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ secrets.ECR_REPOSITORY_URL }}:latest
          # GitHub Actions 캐시에 레이어를 보관해 Gradle 의존성 재다운로드를 피합니다.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # 2) EC2 배포 (수동 승인 게이트)
  #    environment: production 에 Required reviewers를 걸어두면
  #    이 job이 시작되기 전에 승인 대기 상태가 됩니다.
  #    AWS 자격증명은 쓰지 않습니다 - EC2가 인스턴스 프로파일로 직접 ECR을 pull합니다.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 호스트 키를 처음 접속 시점에 신뢰합니다(TOFU).
          # 더 엄격하게 가려면 EC2의 호스트 키를 Secret에 넣고 여기에 직접 기록하세요.
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy over SSH
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
            "ec2-user@${EC2_HOST}" \
            "BE_IMAGE='${IMAGE}' AWS_REGION='${AWS_REGION}' bash -s" <<'REMOTE'
          set -euo pipefail

          cd /opt/tdtc-ai

          # 레지스트리 주소는 이미지 URL 앞부분에서 잘라냅니다.
          REGISTRY="${BE_IMAGE%%/*}"

          # EC2의 IAM 인스턴스 프로파일로 인증합니다 (액세스 키 없음).
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY"

          # BE_IMAGE는 위에서 넘겨받은 값이 .env 값보다 우선 적용됩니다.
          export BE_IMAGE
          docker compose pull be
          docker compose up -d be

          # 오래된 이미지 정리 (디스크 20GB라 금방 찹니다)
          docker image prune -f
          REMOTE

      - name: Health check
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "컨테이너 기동 대기..."
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 "http://${EC2_HOST}/actuator/health" | grep -q '"status":"UP"'; then
              echo "배포 성공: 헬스체크 통과"
              exit 0
            fi
            sleep 5
          done
          echo "헬스체크 실패 - 30회(약 150초) 시도 후 포기"
          exit 1

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
